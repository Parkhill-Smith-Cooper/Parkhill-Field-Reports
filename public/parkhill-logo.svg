<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 232 40"
  width="232"
  height="40"
  role="img"
  aria-label="Parkhill"
>
  <!--
    PLACEHOLDER LOGO.

    Replace this file with the official Parkhill logo asset, keeping the file
    name `parkhill-logo.svg`. Nothing in the code needs to change: both the
    application header and the report header reference this one path, and both
    size it by height with width set to auto, so any aspect ratio works.

    If the official asset is a PNG, drop it in as `parkhill-logo.png` and
    update the single `LOGO_SRC` constant in `src/components/AppHeader.tsx`.
  -->
  <rect x="0" y="2" width="6" height="36" fill="#c8102e" />
  <text
    x="20"
    y="29"
    font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif"
    font-size="27"
    font-weight="700"
    letter-spacing="1.5"
    fill="#1a1a1a"
  >PARKHILL</text>
</svg>
