# Build and deploy ParkhillCXField to Azure App Service (Linux, Node).
#
# BEFORE THIS WILL RUN, set these in the repository
# (Settings -> Secrets and variables -> Actions):
#
#   Variable  AZURE_WEBAPP_NAME      - the App Service name
#   Secrets   AZURE_CLIENT_ID        - the deploy identity Deployment Center
#             AZURE_TENANT_ID          creates (OIDC, same as parkhill-ccr and
#             AZURE_SUBSCRIPTION_ID    parkhill-web-hub - no publish profile)
#
# The App Service itself also needs, one time:
#   - Startup command:  node server.js
#   - Application settings: the variables listed in .env.example
#   - Identity -> System assigned -> On, with the three RBAC roles from the
#     "Azure setup" section of the README assigned to it
#
# No Azure credentials are needed at *runtime* - the app authenticates with its
# managed identity. The OIDC login is only used to upload the build.

name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  # Lets you deploy a specific commit by hand from the Actions tab.
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight deploy rather than racing it.
  group: appservice-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: "24.x"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # Produces .next/standalone - a self-contained server that does not need
      # node_modules at runtime. Note that `npm run build` passes --webpack;
      # see "Known follow-ups" in the README for why Turbopack is disabled.
      - name: Build
        run: npm run build

      # The standalone output deliberately excludes static assets, so they are
      # copied into place here. Getting this wrong is the usual cause of an
      # App Service deploy that starts but renders unstyled.
      - name: Assemble deployment package
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: .next/standalone
          include-hidden-files: true

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    # No `environment:` here - it would change the OIDC subject to
    # environment:production and no longer match the federated credential
    # Deployment Center creates (which trusts refs/heads/main).
    permissions:
      id-token: write # required for the OIDC token
      contents: read
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: .
